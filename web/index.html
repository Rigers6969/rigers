<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wayne Factory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%87%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bat-canvas"></canvas>

  <section id="splash">
    <div class="splash-card">
      <div class="bat-glow">&#129415;</div>
      <h1 id="greeting"></h1>
      <div id="splash-clock" class="clock"></div>
      <div class="clock-label">Tirana time</div>
      <button id="enter-btn">Enter</button>
    </div>
  </section>

  <main id="main" class="hidden">
    <header>
      <h1>The Wayne Factory</h1>
      <div id="header-clock" class="clock small"></div>
    </header>

    <p class="subtitle">Live stats for your YouTube channel and Instagram account.</p>
    <div id="errors"></div>

    <div class="stat-grid">
      <div class="stat-card" id="card-subscribers">
        <div class="stat-icon">&#128101;</div>
        <div class="stat-value" data-target="0">0</div>
        <div class="stat-label">YouTube Subscribers</div>
        <div class="stat-note"></div>
      </div>
      <div class="stat-card" id="card-views">
        <div class="stat-icon">&#128065;</div>
        <div class="stat-value" data-target="0">0</div>
        <div class="stat-label">Total Views</div>
        <div class="stat-note"></div>
      </div>
      <div class="stat-card" id="card-videos">
        <div class="stat-icon">&#127916;</div>
        <div class="stat-value" data-target="0">0</div>
        <div class="stat-label">Videos</div>
        <div class="stat-note"></div>
      </div>
      <div class="stat-card" id="card-followers">
        <div class="stat-icon">&#10084;&#65039;</div>
        <div class="stat-value" data-target="0">0</div>
        <div class="stat-label">Instagram Followers</div>
        <div class="stat-note"></div>
      </div>
      <div class="stat-card" id="card-posts">
        <div class="stat-icon">&#128248;</div>
        <div class="stat-value" data-target="0">0</div>
        <div class="stat-label">Instagram Posts</div>
        <div class="stat-note"></div>
      </div>
    </div>

    <button id="refresh-btn">Refresh stats</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
